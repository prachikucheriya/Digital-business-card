    async function uploadToCloudinary(fileOrDataUrl, resourceType) {
      const { cloudName, uploadPreset } = CLOUDINARY_CONFIG;
      if (!cloudName || cloudName.startsWith('YOUR_') || !uploadPreset || uploadPreset.startsWith('YOUR_')) {
        throw new Error('Cloudinary setup is incomplete. Add your cloud name and unsigned upload preset in index.html.');
      }
      const formData = new FormData();
      formData.append('file', fileOrDataUrl);
      formData.append('upload_preset', uploadPreset);
      const response = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(cloudName)}/${resourceType}/upload`, {
        method: 'POST', body: formData
      });
      const result = await response.json();
      if (!response.ok || !result.secure_url) throw new Error(result.error?.message || `Cloudinary upload failed (${response.status}).`);
      return result.secure_url;
    }

    async function loadClientsFromFirestore() {
      const snapshot = await clientsCollection.get();
      AppState.clients = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.data().id || doc.id, _firestoreSlug: doc.id }));
    }

    function makeFirestoreSafe(value) {
      if (value === undefined || typeof value === 'function' || typeof value === 'symbol' || typeof value === 'bigint') return undefined;
      if (typeof File !== 'undefined' && value instanceof File) return undefined;
      if (typeof Blob !== 'undefined' && value instanceof Blob) return undefined;
      if (Array.isArray(value)) return value.flat(Infinity).map(makeFirestoreSafe).filter(item => item !== undefined);
      if (value && typeof value === 'object' && !(value instanceof Date)) {
        const safe = {};
        Object.entries(value).forEach(([key, item]) => {
          const cleaned = makeFirestoreSafe(item);
          if (cleaned !== undefined) safe[key] = cleaned;
        });
        return safe;
      }
      return value;
    }

    async function moveLegacyMediaToCloudinary(client) {
      const uploadDataUrl = async (url, label) => {
        if (typeof url !== 'string' || !url.startsWith('data:')) return url;
        return uploadToCloudinary(url, 'image');
      };
      client.basicInfo = client.basicInfo || {};
      client.basicInfo.avatarUrl = await uploadDataUrl(client.basicInfo.avatarUrl, 'avatar');
      client.gallery = Array.isArray(client.gallery) ? client.gallery : [];
      for (const [index, image] of client.gallery.entries()) {
        image.url = await uploadDataUrl(image.url, `gallery-${index}`);
      }
      const catalogItems = [...(client.services || []), ...(client.products || [])];
      for (const [index, item] of catalogItems.entries()) {
        item.image = await uploadDataUrl(item.image, `catalog-${index}`);
      }
    }

    async function saveClientToFirestore(client) {
      if (!firebaseAuth.currentUser) throw new Error('Please sign in before saving profiles.');
      await moveLegacyMediaToCloudinary(client);
      const oldSlug = client._firestoreSlug || client.slug;
      const cleanClient = makeFirestoreSafe(client);
      delete cleanClient._firestoreSlug;
      if (oldSlug !== client.slug) {
        const target = clientsCollection.doc(client.slug);
        await firestore.runTransaction(async transaction => {
          const existing = await transaction.get(target);
          if (existing.exists) throw new Error('That profile link is already in use. Choose a different business name.');
          transaction.set(target, cleanClient);
          transaction.delete(clientsCollection.doc(oldSlug));
        });
      } else {
        await clientsCollection.doc(client.slug).set(cleanClient);
      }
      client._firestoreSlug = client.slug;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgClass = type === 'success' ? 'bg-emerald-600 border-emerald-500' : type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-blue-600 border-blue-500';
      const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border text-white text-sm font-medium shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function copyToClipboard(text, message = 'Copied to clipboard!') {
      try {
        const dummy = document.createElement('textarea');
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        showToast(message, 'success');
      } catch (err) {
        showToast('Failed to copy', 'error');
      }
    }

    function generateSlug(name) {
      if (!name) return 'profile-' + Math.floor(Math.random() * 1000);
      let baseSlug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
      if (!baseSlug) baseSlug = 'profile';
      
      let slug = baseSlug;
      let counter = 2;
      while (AppState.clients.some(c => c.slug === slug && c.id !== AppState.currentClientId)) {
        slug = `${baseSlug}-${counter}`;
        counter++;
      }
      return slug;
    }

    function getRenewalStatusInfo(client) {
      const today = new Date();
      const renewalDate = new Date(client.renewalDate);
      const reminderDate = new Date(renewalDate);
      reminderDate.setDate(reminderDate.getDate() - 15);
      
      let status = 'paid';
      let tag = '<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold">Paid</span>';
      
      if (client.paymentStatus !== 'paid') {
        if (today > renewalDate) {
          status = 'overdue';
          tag = '<span class="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold">Overdue</span>';
        } else if (today >= reminderDate) {
          status = 'due';
          tag = '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold">Due Soon</span>';
        }
      }
      
      const diffTime = renewalDate - today;
      const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      return { status, tag, daysLeft, renewalDateStr: renewalDate.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) };
    }

    async function signInAdmin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;

    async function createNewClient() {
      const newId = 'c_' + Date.now();
      const newClient = {
        id: newId,
        slug: 'new-profile-' + Date.now().toString().slice(-4), // Temporary, will be updated based on business name
        status: 'draft',
        activationDate: new Date().toISOString(),
        renewalDate: new Date(new Date().setFullYear(new Date().getFullYear() + 1)).toISOString(),
        renewalAmount: 999,
        paymentStatus: 'paid',
        basicInfo: { fullName: '', businessName: '', phone: '', whatsapp: '', email: '', website: '', bio: '', address: '', googleMapsUrl: '', openingHours: '', avatarUrl: '', logoUrl: '', theme: 'modern' },
        socials: { instagram: '', facebook: '', youtube: '', linkedin: '', telegram: '' },
        galleryConfig: { style: 'grid', captionVisible: true },
        gallery: [], videos: [], services: [], products: [], links: [],
        sectionOrder: JSON.parse(JSON.stringify(DEFAULT_SECTION_ORDER)),
        analytics: { views: 0, leads: 0, clicks: 0 },
        leads: []
      };
      try {
        await saveClientToFirestore(newClient);
        AppState.clients.push(newClient);
      } catch (error) {
        console.error('Could not create Firestore profile:', error);
        showToast(`Could not save profile: ${error.message}`, 'error');
        return;
      }
      AppState.activeClientTab = 'basic';
      navigateTo('dashboard', 'client_builder', newId);
      showToast('Draft profile created. Please fill in details.');
    }

    async function duplicateClient(id) {
      const c = AppState.clients.find(x => x.id === id);
      if (!c) return;
      
      const newId = 'c_' + Date.now();
      const newClient = JSON.parse(JSON.stringify(c)); // Deep clone
      
      newClient.id = newId;
      delete newClient._firestoreSlug;
      newClient.slug = generateSlug(c.basicInfo.businessName + ' Copy');
      newClient.basicInfo.businessName += ' (Copy)';
      newClient.status = 'draft';
      newClient.activationDate = new Date().toISOString();
      newClient.renewalDate = new Date(new Date().setFullYear(new Date().getFullYear() + 1)).toISOString();
      newClient.paymentStatus = 'paid';
      newClient.analytics = { views: 0, leads: 0, clicks: 0 };
      newClient.leads = [];
      
      try {
        await saveClientToFirestore(newClient);
      } catch (error) {
        console.error('Could not duplicate Firestore profile:', error);
        showToast(`Could not duplicate profile: ${error.message}`, 'error');
        return;
      }
      AppState.clients.push(newClient);
      renderApp();
      showToast('Client profile duplicated!');
    }

    async function deleteClient(id) {
      if (confirm('Are you sure you want to completely delete this client? This cannot be undone.')) {
        const client = AppState.clients.find(c => c.id === id);
        try {
          if (client) await clientsCollection.doc(client._firestoreSlug || client.slug).delete();
        } catch (error) {
          console.error('Could not delete Firestore profile:', error);
          showToast(`Could not delete profile: ${error.message}`, 'error');
          return;
        }
        AppState.clients = AppState.clients.filter(c => c.id !== id);
        renderApp();
        showToast('Client deleted permanently.', 'error');
      }
    }

    async function handleProfilePhotoUpload(event, clientId) {
      const file = event.target.files[0];
      const c = AppState.clients.find(x => x.id === clientId);
      if (!file || !c) return;
      if (file.size > 10 * 1024 * 1024) return showToast('Choose a photo smaller than 10 MB.', 'error');
      try {
        c.basicInfo.avatarUrl = await uploadToCloudinary(file, 'image');
        document.getElementById('avatar-preview').src = c.basicInfo.avatarUrl;
        showToast('Photo uploaded. Save Changes to publish the profile update.');
      } catch (error) {
        console.error('Could not upload profile photo:', error);
        showToast(`Photo upload failed: ${error.message}`, 'error');
      }
    }

    function removeProfilePhoto(clientId) {
      const c = AppState.clients.find(x => x.id === clientId);
      c.basicInfo.avatarUrl = '';
      document.getElementById('avatar-preview').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.basicInfo.businessName || 'C') + '&background=0D8ABC&color=fff';
      showToast('Profile photo removed.');
    }

    function updateClientField(clientId, field, value) {
      const c = AppState.clients.find(x => x.id === clientId);
      if (!c) return;
      if (field === 'status') {
        c.status = value;
        saveClientStatus(c);
        return;
      }
      c.basicInfo[field] = value;
    }

    async function saveClientStatus(client) {
      if (client.basicInfo.businessName && client.slug.includes('new-profile')) {
        client.slug = generateSlug(client.basicInfo.businessName);
      }
      try {
        await saveClientToFirestore(client);
        showToast('Profile visibility updated.');
      } catch (error) {
        console.error('Could not save profile visibility:', error);
        showToast(`Could not update visibility: ${error.message}`, 'error');
      } finally {
        renderApp();
      }
    }
    
    function updateClientSocial(clientId, field, value) {
      const c = AppState.clients.find(x => x.id === clientId);
      c.socials[field] = value;
    }

      const c = AppState.clients.find(x => x.id === clientId);
      c[type][idx].enabled = c[type][idx].enabled === false ? true : false;
      renderApp();
    }

    function deleteClientMedia(clientId, type, id) {
      const c = AppState.clients.find(x => x.id === clientId);
      c[type] = c[type].filter(m => m.id !== id);
      renderApp();
    }

    function updateClientMediaField(clientId, type, idx, field, value) {
      const c = AppState.clients.find(x => x.id === clientId);
      c[type][idx][field] = value;
      // No re-render needed for text inputs if bound correctly, but doing it to ensure sync
      renderApp(); 
    }

    function reorderClientMedia(clientId, type, idx, direction) {
      const c = AppState.clients.find(x => x.id === clientId);
      const arr = c[type];
      const target = idx + direction;
      if (target >= 0 && target < arr.length) {
        const temp = arr[idx];
        arr[idx] = arr[target];
        arr[target] = temp;
        renderApp();
      }

    async function handleClientGalleryFiles(event, clientId) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const c = AppState.clients.find(x => x.id === clientId);
      if (!c) return;
      
      if (c.gallery.length + files.length > 30) {
        showToast(`Cannot add ${files.length} photos. Limit is 30.`, 'error');
        return;
      }
      const added = [];
      try {
        for (const file of files) {
          if (file.size > 10 * 1024 * 1024) throw new Error(`${file.name} is larger than 10 MB.`);
          const imageUrl = await uploadToCloudinary(file, 'image');
          added.push({ id: 'img_' + Date.now() + Math.random(), url: imageUrl, title: '', caption: '', enabled: true });
        }
        c.gallery.push(...added);
        closeModal();
        renderApp();
        showToast(`${added.length} photo(s) uploaded. Save Changes to publish them.`);
      } catch (error) {
        console.error('Could not upload gallery image:', error);
        showToast(`Gallery upload failed: ${error.message}`, 'error');
      }
    }

    async function submitClientVideo(clientId) {
      const c = AppState.clients.find(x => x.id === clientId);
      const isUpload = !document.getElementById('sec-vupload').classList.contains('hidden');
      const title = document.getElementById('modal-vid-title').value;
      
      let url = '';
      let embedUrl = '';

      if (isUpload) {
        const fileInput = document.getElementById('vid-file');
        if (!fileInput.files.length) { showToast('Please select a video file.', 'error'); return; }
        const file = fileInput.files[0];
        if (file.size > 100 * 1024 * 1024) { showToast('Choose a video smaller than 100 MB.', 'error'); return; }
        try {
          url = await uploadToCloudinary(file, 'video');
        } catch (error) {
          console.error('Could not upload video:', error);
          showToast(`Video upload failed: ${error.message}`, 'error');
          return;
        }
      } else {
        url = document.getElementById('modal-vid-url').value;
        if (!url) { showToast('Please enter a valid link.', 'error'); return; }
        
        // Basic parser for YouTube to make it embeddable
        if (url.includes('youtube.com/watch?v=')) {
          const id = url.split('v=')[1]?.split('&')[0];
          embedUrl = `https://www.youtube.com/embed/${id}`;
        } else if (url.includes('youtu.be/')) {
          const id = url.split('youtu.be/')[1]?.split('?')[0];
          embedUrl = `https://www.youtube.com/embed/${id}`;
        } else if (url.includes('youtube.com/shorts/')) {
           const id = url.split('shorts/')[1]?.split('?')[0];
           embedUrl = `https://www.youtube.com/embed/${id}`;
        } else {
           embedUrl = url; 
        }
      }

      c.videos.push({ id: 'vid_' + Date.now(), type: isUpload ? 'upload' : 'url', url, title, embedUrl, enabled: true });
      closeModal();
      renderApp();
      showToast('Video added to profile!');
    }

    // Extracted HTML generation for reusability in Live Preview and Public Page

      const c = AppState.clients.find(x => x.id === clientId);
      const b = c.basicInfo;
      let html = `<div class="profile-content space-y-4 text-center ${isPreview ? 'p-3' : 'pb-12'}">`;

      // Keep the email contact icon beside social links, after them.
      const publicSections = c.sectionOrder.filter(sec => sec.enabled);
      const emailIndex = publicSections.findIndex(sec => sec.type === 'Email');
      if (emailIndex >= 0) {
        const [emailSection] = publicSections.splice(emailIndex, 1);
        const socialTypes = ['Website', 'Instagram', 'Facebook', 'YouTube', 'LinkedIn', 'Telegram'];
        let lastSocialIndex = -1;
        publicSections.forEach((sec, index) => { if (socialTypes.includes(sec.type)) lastSocialIndex = index; });
        publicSections.splice(lastSocialIndex + 1, 0, emailSection);
      }
      publicSections.forEach(block => {
        switch(block.type) {
          
          case 'ProfilePhoto':
            html += `<div class="text-center pt-2"><img src="${b.avatarUrl || 'https://ui-avatars.com/api/?name=C'}" class="w-24 h-24 rounded-full mx-auto border-4 border-blue-500 object-cover shadow-xl" /></div>`;
            break;
            
          case 'FullName':
            html += `<h1 class="text-2xl font-extrabold tracking-tight text-center leading-tight">${b.fullName}</h1>`;
            break;
            
          case 'BusinessName':
            html += `<p class="text-sm font-bold text-blue-400 text-center -mt-2">${b.businessName}</p>`;
            break;
            
          case 'Bio':
            if (b.bio) html += `<p class="text-[11px] opacity-90 leading-relaxed px-4 py-3 bg-black/20 rounded-2xl border border-white/10 text-center shadow-inner">${b.bio}</p>`;
            break;

          // Social & Action Buttons
          case 'WhatsApp':
            if(b.whatsapp) html += renderPublicBtn(block, `https://wa.me/${b.whatsapp}`, true);
            break;
          case 'Call':
            if(b.phone) html += renderPublicBtn(block, `tel:${b.phone}`, true);
            break;
          case 'Email':
            if(b.email) html += renderPublicBtn(block, `mailto:${b.email}`, true);
            break;
          case 'Website':
            if(b.website) html += renderPublicBtn(block, b.website, true);
            break;
          case 'Instagram':
            if(c.socials.instagram) html += renderPublicBtn(block, c.socials.instagram, true);
            break;
          case 'Facebook':
            if(c.socials.facebook) html += renderPublicBtn(block, c.socials.facebook, true);
            break;
          case 'YouTube':
            if(c.socials.youtube) html += renderPublicBtn(block, c.socials.youtube, true);
            break;

          case 'vCard':
            html += `
              <button onclick="${isPreview ? '' : 'downloadVCard()'}" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:opacity-90 text-white font-extrabold text-sm shadow-xl transition transform active:scale-95 flex items-center justify-center gap-3">
                <i class="fa-solid fa-address-card text-lg"></i> Save Contact (.vcf)
              </button>
            `;
            break;

          // Gallery Engine with Layout Support
          case 'Gallery':
            const gv = c.gallery.filter(g => g.enabled !== false);
            if (gv.length > 0) {
              let layoutCls = 'grid grid-cols-2 gap-2'; // Default grid
              let gHtml = gv.map(g => `<img src="${g.url}" class="w-full aspect-square object-cover rounded-xl shadow-sm border border-white/10"/>`).join('');
              
              if (c.galleryConfig.style === 'simple') { 
                layoutCls = 'flex flex-col gap-3'; 
                gHtml = gv.map(g => `<img src="${g.url}" class="w-full h-auto object-cover rounded-2xl shadow-md border border-white/10"/>`).join(''); 
              }
              else if (c.galleryConfig.style === 'large') { 
                layoutCls = 'flex flex-col gap-4'; 
                gHtml = gv.map(g => `<div class="rounded-2xl overflow-hidden bg-black/40 border border-white/10 shadow-md"><img src="${g.url}" class="w-full h-auto object-cover"/>${(c.galleryConfig.captionVisible && (g.title || g.caption)) ? `<div class="p-4"><p class="font-bold text-sm text-white">${g.title}</p>${g.caption ? `<p class="text-xs opacity-70 mt-1">${g.caption}</p>` : ''}</div>` : ''}</div>`).join(''); 
              }
              else if (c.galleryConfig.style === 'masonry') { 
                layoutCls = 'masonry-grid'; 
                gHtml = gv.map(g => `<div class="masonry-item rounded-xl overflow-hidden border border-white/10"><img src="${g.url}" class="w-full h-auto object-cover"/></div>`).join(''); 
              }

              html += `<div class="card-bg p-5 rounded-3xl border border-white/10 shadow-xl space-y-4"><h3 class="font-bold text-base flex items-center gap-2 text-white"><i class="fa-solid fa-images text-emerald-400"></i> ${block.title}</h3><div class="${layoutCls}">${gHtml}</div></div>`;
            }
            break;

          // Videos Showcase
          case 'Videos':
            const vv = c.videos.filter(v => v.enabled !== false);
            if (vv.length > 0) {
              const vHtml = vv.map(v => {
                const youtubeId = (v.embedUrl || '').match(/youtube\.com\/embed\/([^?&]+)/)?.[1];
                const poster = youtubeId ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg` : '';
                const videoStage = v.embedUrl
                  ? `<div data-profile-video data-video-src="${encodeURIComponent(v.embedUrl)}" class="relative aspect-video bg-black"><img src="${poster}" alt="${v.title || 'Video preview'}" class="w-full h-full object-cover" onerror="this.style.display='none'"><button type="button" onclick="playProfileVideo(this)" aria-label="Play ${v.title || 'video'}" class="absolute inset-0 w-full h-full flex items-center justify-center bg-black/25 hover:bg-black/40 transition"><span class="w-16 h-16 rounded-full bg-rose-600 text-white flex items-center justify-center shadow-xl"><i class="fa-solid fa-play ml-1 text-xl"></i></span></button></div>`
                  : `<div data-profile-video class="relative aspect-video bg-black"><video src="${v.url}" preload="metadata" playsinline class="w-full h-full object-contain"></video><button type="button" onclick="playProfileVideo(this)" aria-label="Play ${v.title || 'video'}" class="absolute inset-0 w-full h-full flex items-center justify-center bg-black/25 hover:bg-black/40 transition"><span class="w-16 h-16 rounded-full bg-rose-600 text-white flex items-center justify-center shadow-xl"><i class="fa-solid fa-play ml-1 text-xl"></i></span></button></div>`;
                return `
                  <div class="rounded-2xl overflow-hidden border border-white/10 mb-4 bg-black/40 shadow-md">
                    ${videoStage}
                    <div class="p-4"><h4 class="font-bold text-sm text-white">${v.title}</h4>${v.description ? `<p class="text-xs opacity-70 mt-1">${v.description}</p>` : ''}</div>
                  </div>
                `;
              }).join('');
              html += `<div class="card-bg p-5 rounded-3xl border border-white/10 shadow-xl space-y-3"><h3 class="font-bold text-base flex items-center gap-2 text-white"><i class="fa-solid fa-circle-play text-rose-400"></i> ${block.title}</h3><div>${vHtml}</div></div>`;
            }
            break;

          // Map & Hours
          case 'Map':
            if (b.address || b.googleMapsUrl || b.openingHours) {
              html += `
                <div class="card-bg p-5 rounded-3xl border border-white/10 shadow-xl space-y-3 text-sm">
                  <h3 class="font-bold flex items-center gap-2 mb-3 text-white"><i class="fa-solid fa-location-dot text-rose-400"></i> ${block.title}</h3>
                  ${b.address ? `<p class="opacity-90 leading-relaxed text-xs">${b.address}</p>` : ''}
                  ${b.openingHours ? `<div class="flex items-center gap-2 mt-3 bg-blue-500/20 text-blue-300 font-bold px-3 py-2 rounded-xl text-xs border border-blue-500/30"><i class="fa-solid fa-clock"></i> ${b.openingHours}</div>` : ''}
                  ${b.googleMapsUrl ? `<a href="${b.googleMapsUrl}" target="_blank" class="flex items-center justify-center gap-2 mt-3 w-full py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-white text-xs font-bold transition border border-white/10 shadow-md"><i class="fa-solid fa-map-marked-alt"></i> Navigate on Maps</a>` : ''}
                </div>
              `;
            }
            break;

          // Contact Form
          case 'ContactForm':
            html += `
              <div class="card-bg p-5 rounded-3xl border border-white/10 shadow-xl space-y-4">
                <h3 class="font-bold text-base flex items-center gap-2 text-white"><i class="fa-solid fa-paper-plane text-cyan-400"></i> Send Enquiry</h3>
                <form class="space-y-3">
                  <input type="text" placeholder="Your Name" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500"/>
                  <input type="text" placeholder="Mobile / WhatsApp" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500"/>
                  <textarea rows="2" placeholder="Message..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                  <button type="button" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white shadow-md">Submit Enquiry</button>
                </form>
              </div>
            `;
            break;
        }
      });

      html += `<div class="text-center pt-8 border-t border-white/10 mt-6"><span class="text-[10px] opacity-50 uppercase tracking-widest font-bold">Powered by <strong>Netria Connect</strong></span></div></div>`;
      return html;
    }

    function playProfileVideo(button) {
      const stage = button.closest('[data-profile-video]');
      if (!stage) return;
      const video = stage.querySelector('video');
      if (video) {
        video.controls = true;
        button.remove();
        const playback = video.play();
        if (playback && typeof playback.catch === 'function') playback.catch(error => {
          console.error('Video playback failed:', error);
          showToast('Could not play this video. Please try again.', 'error');
        });
        return;
      }
      try {
        const embedUrl = decodeURIComponent(stage.dataset.videoSrc || '');
        const url = new URL(embedUrl);
        url.searchParams.set('autoplay', '1');
        const iframe = document.createElement('iframe');
        iframe.src = url.toString();
        iframe.className = 'w-full aspect-video';
        iframe.setAttribute('title', 'Profile video');
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('frameborder', '0');
        stage.replaceChildren(iframe);
      } catch (error) {
        console.error('Could not open profile video:', error);
        showToast('Could not open this video. Please check the video link.', 'error');
      }
    }

    function renderPublicBtn(block, url, isBrand = false) {
      const iconByType = {
        Website: ['fa-solid', 'fa-globe', '#111827'], Call: ['fa-solid', 'fa-phone', '#16a34a'], Email: ['fa-solid', 'fa-envelope', '#ea4335'], Instagram: ['fa-brands', 'fa-instagram', '#e1306c'],
        Facebook: ['fa-brands', 'fa-facebook-f', '#1877f2'], YouTube: ['fa-brands', 'fa-youtube', '#ff0000'],
        LinkedIn: ['fa-brands', 'fa-linkedin-in', '#0a66c2'], Telegram: ['fa-brands', 'fa-telegram', '#229ed9']
      };
      const socialIcon = isBrand ? iconByType[block.type] : null;
      if (socialIcon) {
        const [iconFamily, iconName, color] = socialIcon;
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" aria-label="${block.title}" title="${block.title}" class="profile-icon-link" style="color:${color}"><i class="${iconFamily} ${iconName}" aria-hidden="true"></i></a>`;
      }
      const iCls = `fa-solid ${getSectionIcon(block.type)}`;
      const cCls = block.color || 'bg-slate-800';
      return `
        <a href="${url}" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-5 rounded-2xl ${cCls} text-white flex items-center justify-between shadow-lg transition transform active:scale-95 mb-2 hover:brightness-110">
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-black/20 flex items-center justify-center"><i class="${iCls} text-lg"></i></div>
            <span class="font-bold text-sm tracking-wide drop-shadow-md">${block.title}</span>
          </div>
          <i class="fa-solid fa-chevron-right opacity-50 text-xs"></i>
        </a>
      `;
    }


    // INIT APP
    window.onload = async function() {
      const pathMatch = window.location.pathname.match(/^\/p\/([^/]+)\/?$/);
      if (pathMatch) {
        const slug = decodeURIComponent(pathMatch[1]);
        AppState.publicSlug = slug;
        AppState.clients = [];
        AppState.currentView = 'public-profile';
        document.getElementById('view-viewport').innerHTML = `<div class="min-h-screen flex items-center justify-center bg-slate-950 text-white">Loading profile…</div>`;
        try {
          const snapshot = await clientsCollection.doc(slug).get();
          if (snapshot.exists) AppState.clients = [{ ...snapshot.data(), id: snapshot.data().id || snapshot.id, _firestoreSlug: snapshot.id }];
        } catch (error) {
          console.error('Could not load public profile:', error);
        }
        renderApp();
        return;
      }
      navigateTo('login');
    };

  </script>
</body>
</html>
